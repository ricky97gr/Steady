services:
  postgres:
    image: postgres:16-alpine
    container_name: quant-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: ../collector
      dockerfile: Dockerfile
    container_name: quant-collector
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../collector:/app
      - ./logs:/app/logs
    command: python -m app.tasks

  quant-engine:
    build:
      context: ../quant-engine
      dockerfile: Dockerfile
    container_name: quant-engine
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../quant-engine:/app
      - ./logs:/app/logs
    command: python -m app.tasks

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: quant-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/configs:/app/configs
      - ./logs:/app/logs

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: quant-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: quant-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
