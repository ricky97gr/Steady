# ===== VM 运行专用 compose（只运行，不编译）=====
# 原则：VM 只跑镜像，代码以「本地构建 → docker save → 搬运 → docker load」交付。
# 本文件无任何 build: 段 —— VM 从结构上就不可能编译，缺镜像只会报 pull 错误。
# 安装/升级/回滚统一用 install.sh（三件套发布目录内）。
# 自包含：所有挂载相对本目录（nginx/ postgres/ configs/ logs/），整目录可搬到任意位置。

services:
  postgres:
    image: postgres:16-alpine
    container_name: quant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # 仅本机可连（pg_dump / 调试用），不暴露到局域网
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536m

  collector:
    # 由 install.sh 从发布产物 docker load 进来
    image: steady/collector:latest
    container_name: quant-collector
    restart: unless-stopped
    environment:
      # 定时任务按北京时间触发（APScheduler 使用本地时区）
      TZ: Asia/Shanghai
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command: python -m app.tasks
    deploy:
      resources:
        limits:
          memory: 1024m

  quant-engine:
    image: steady/quant-engine:latest
    container_name: quant-engine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command: python -m app.tasks
    deploy:
      resources:
        limits:
          memory: 1024m

  backend:
    image: steady/backend:latest
    container_name: quant-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # 仅本机可连（curl 调试），外网只走 nginx:80；API 无鉴权，绝不能直接暴露
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 配置留在宿主机（自包含目录内的 configs/），改 config.yaml 后重启容器即生效
      - ./configs/config.yaml:/app/configs/config.yaml
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 256m

  frontend:
    image: steady/frontend:latest
    container_name: quant-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128m

  nginx:
    image: nginx:alpine
    container_name: quant-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  postgres_data:
